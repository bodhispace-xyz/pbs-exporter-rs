name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to publish or repair
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout publication tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve release validator
        run: cp scripts/release_context.py "$RUNNER_TEMP/pbs-release-context.py"

      - name: Checkout publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Validate release identity
        id: context
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 "$RUNNER_TEMP/pbs-release-context.py" --root "$GITHUB_WORKSPACE" --tag "$RELEASE_TAG"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.context.outputs.is_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: steps.context.outputs.is_release == 'true'

      - name: Build release binary
        if: steps.context.outputs.is_release == 'true'
        run: cargo build --release --locked

      - name: Create release archive
        if: steps.context.outputs.is_release == 'true'
        run: |
          mkdir -p release
          cp target/release/pbs-exporter README.md LICENSE release/
          tar -czf pbs-exporter-linux-amd64.tar.gz -C release .
          sha256sum pbs-exporter-linux-amd64.tar.gz > pbs-exporter-linux-amd64.tar.gz.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ steps.context.outputs.is_release != 'true' }}
            type=raw,value=sha-${{ steps.context.outputs.sha }}
            type=raw,value=${{ steps.context.outputs.tag }},enable=${{ steps.context.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.context.outputs.version }},enable=${{ steps.context.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.context.outputs.is_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.context.outputs.tag }},enable=${{ steps.context.outputs.is_release == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.context.outputs.tag }},enable=${{ steps.context.outputs.is_release == 'true' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.context.outputs.sha }}
            org.opencontainers.image.version=${{ steps.context.outputs.is_release == 'true' && steps.context.outputs.version || 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release if needed and attach assets
        if: steps.context.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes "See CHANGELOG.md at this tag for release notes."
          fi
          gh release upload "$RELEASE_TAG" \
            pbs-exporter-linux-amd64.tar.gz \
            pbs-exporter-linux-amd64.tar.gz.sha256 \
            --clobber
